# Lấy giá bạc Phú Quý định kỳ và ghi vào data/phuquy.json (bang-gia.html đọc file này).
# GitHub chạy lịch tối thiểu 5 phút/lần và thường trễ thêm vài phút.
name: Giá bạc Phú Quý

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

concurrency:
  group: phuquy
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lấy giá Phú Quý
        run: node tools/phuquy-fetch.mjs data/phuquy.json

      - name: Commit nếu giá thay đổi
        run: |
          if [ -z "$(git status --porcelain -- data/phuquy.json)" ]; then
            echo "Không có thay đổi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/phuquy.json
          git commit -m "Cập nhật giá bạc Phú Quý"
          git pull --rebase --autostash
          git push
