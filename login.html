<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Đăng nhập · Giá Vàng</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand brand--center">
      <img src="assets/logo.svg" alt="" class="brand__logo" width="48" height="48">
      <div>
        <h1 class="brand__name">Giá Vàng</h1>
        <p class="brand__tagline">Khu vực nội bộ</p>
      </div>
    </div>

    <form id="login-form" class="form" novalidate>
      <div class="field">
        <label for="username">Tên đăng nhập</label>
        <input id="username" name="username" type="text" autocomplete="username"
               autocapitalize="none" spellcheck="false" required autofocus>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <div class="input-group">
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="button" class="input-group__btn" data-toggle-password="password"
                  aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button>
        </div>
      </div>

      <p id="login-error" class="form-message" role="alert" hidden></p>

      <button id="login-submit" type="submit" class="btn btn--primary btn--block">Đăng nhập</button>
    </form>

    <p class="auth-note">
      Tài khoản do quản trị viên cấp. Không có chức năng tự đăng ký.
    </p>
  </main>

  <script src="js/csv.js"></script>
  <script src="js/password.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
